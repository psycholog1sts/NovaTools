name: Wave 2 converter certification migration

on:
  push:
    branches: [wave2/site-transformation]
    paths:
      - scripts/apply-converters-certification.mjs
      - .github/workflows/wave2-converters-certification-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[converter-cert-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave2/site-transformation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply converter certification migration
        run: node scripts/apply-converters-certification.mjs --write
      - name: Commit deterministic output
        shell: bash
        run: |
          if git diff --quiet -- vite.config.js src/tools/converters/percentage-calculator/index.html src/tools/converters/unit-converter/index.html src/data/tool-certification.json; then
            echo "No converter certification changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.js src/tools/converters/percentage-calculator/index.html src/tools/converters/unit-converter/index.html src/data/tool-certification.json
          git commit -m "feat: certify percentage and unit converters [converter-cert-output]"
          git push origin HEAD:wave2/site-transformation
