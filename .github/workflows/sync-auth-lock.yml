name: Sync auth-foundation lockfile

on:
  push:
    branches: [agent/pro-platform-phase2c-auth-foundation]

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/pro-platform-phase2c-auth-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock after test runner hardening"
          git push origin HEAD:agent/pro-platform-phase2c-auth-foundation
