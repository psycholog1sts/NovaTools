name: rlsproof-one-time-certification-migration

on:
  push:
    branches:
      - integrate-rlsproof-20260911

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register RLSProof certification and test contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const matrixPath = 'src/data/tool-certification.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          const record = {
            Tool: 'RLSProof',
            Route: '/tools/security/rlsproof/',
            Category: 'security',
            Indexable: true,
            AdsEligible: true,
            FunctionalTruth: 'PASS',
            UniqueUtility: 'PASS',
            SpecificContent: 'PASS',
            ImplementationEvidence: 'PASS',
            NoFiller: 'PASS',
            Trust: 'PASS',
            PrivacyTruth: 'EXTERNAL_API',
            ExternalNetwork: true,
            DataSource: 'User-supplied public GitHub repository plus the public GitHub REST API; selected public metadata, tree and blob requests originate in the visitor browser',
            SyntheticData: 'NONE',
            KnownLimitations: 'Quick Scan supports public repositories only and bounded native static checks: at most 18 selected files, 128 KiB per file, 1 MiB total content, 5,000 tree entries and repositories up to 50,000 KiB. Unauthenticated GitHub API rate limits apply. It does not run Gitleaks, OSV-Scanner, Opengrep, database proof or private-repository analysis, so clean results remain incomplete rather than PASS.',
            UIStatus: 'SPECIALIZED_VERIFIED',
            Tests: 'RLSProof integration contract + browser core fail-closed contract + canonical/public-route/build verification',
            CertificationStatus: 'CERTIFIED',
            ImplementationStatus: 'PRODUCTION_CERTIFIED',
            RuntimeStatus: 'ENABLED',
            SEOStatus: 'INDEXABLE',
            DiscoveryStatus: 'ELIGIBLE',
            SitemapStatus: 'INCLUDED',
            TestStatus: 'SOURCE_AND_BROWSER_CORE_CERTIFIED'
          };
          matrix.records = matrix.records.filter((item) => item.Route !== record.Route);
          matrix.records.push(record);
          fs.writeFileSync(matrixPath, `${JSON.stringify(matrix, null, 2)}\n`);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const command = 'node tests/rlsproof-integration.mjs';
          if (!pkg.scripts.test.includes(command)) pkg.scripts.test = `${command} && ${pkg.scripts.test}`;
          if (!pkg.scripts['test:unit'].includes(command)) pkg.scripts['test:unit'] = `${command} && ${pkg.scripts['test:unit']}`;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Remove migration workflow and commit generated source changes
        shell: bash
        run: |
          git rm .github/workflows/rlsproof-matrix-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tool-certification.json package.json
          git commit -m "chore: register RLSProof in certification matrix"
          git push origin HEAD:integrate-rlsproof-20260911
