name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run ESLint
        run: npm run lint

      - name: Audit static media dimensions
        run: npm run lint:media-dimensions

      - name: Check blog outlines
        run: npm run lint:blog-outlines

      - name: Run tests
        run: npm test

      - name: Verify Supabase RLS migration contract
        run: node tests/supabase-migration-contract.mjs

      - name: Run live-data regression tests
        run: node tests/live-data-regressions.mjs

      - name: Validate Cloudflare smoke policy
        run: node tests/cloudflare-smoke-contract.mjs

      - name: Compile Cloudflare Pages Functions
        run: npx --yes wrangler@4.114.0 pages functions build functions --outfile=/tmp/pages-functions-worker.js

      - name: Build
        run: npm run build

      - name: Install pinned browser test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E and accessibility gates
        run: npx playwright test

      - name: Verify sitemap and site link export
        run: npm run lint:site-links

      - name: Audit public routes
        run: npm run audit:public-routes

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Audit dependencies
        run: node scripts/audit-dependencies.mjs

  production-guard:
    name: Verify production commit provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Require merged PR provenance for main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-main-pr-merge.mjs

  production-deploy:
    name: Build, deploy, and audit production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [security-audit, production-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run ESLint
        run: npm run lint

      - name: Audit static media dimensions
        run: npm run lint:media-dimensions

      - name: Check blog outlines
        run: npm run lint:blog-outlines

      - name: Run tests
        run: npm test

      - name: Verify Supabase RLS migration contract
        run: node tests/supabase-migration-contract.mjs

      - name: Run live-data regression tests
        run: node tests/live-data-regressions.mjs

      - name: Validate Cloudflare smoke policy
        run: node tests/cloudflare-smoke-contract.mjs

      - name: Compile Cloudflare Pages Functions
        run: npx --yes wrangler@4.114.0 pages functions build functions --outfile=/tmp/pages-functions-worker.js

      - name: Build
        run: npm run build

      - name: Install pinned browser test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E and accessibility gates
        run: npx playwright test

      - name: Verify sitemap and site link export
        run: npm run lint:site-links

      - name: Audit public routes
        run: npm run audit:public-routes

      - name: Verify Cloudflare Pages build output
        run: test -d dist && test -f dist/index.html

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.114.0 pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"

      - name: Resolve deployed Cloudflare Pages URLs
        run: node scripts/resolve-cloudflare-pages-deployment.mjs

      - name: Smoke-test deployed Pages origins
        run: node scripts/smoke-cloudflare-pages.mjs

      - name: Diagnose custom-domain edge policy
        env:
          CUSTOM_DOMAIN_HEALTH_URL: https://mc-novatools.com/api/health
        run: node scripts/diagnose-cloudflare-edge.mjs

      - name: Run deterministic local Lighthouse CI
        id: lighthouse
        continue-on-error: true
        run: npm run lighthouse:ci

      - name: Report blocking Lighthouse audits
        if: steps.lighthouse.outcome == 'failure'
        run: node scripts/report-lighthouse-failures.mjs

      - name: Enforce Lighthouse gate
        if: steps.lighthouse.outcome == 'failure'
        run: exit 1
