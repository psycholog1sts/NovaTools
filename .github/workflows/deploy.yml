name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run ESLint
        run: npm run lint

      - name: Audit static media dimensions
        run: npm run lint:media-dimensions

      - name: Check blog outlines
        run: npm run lint:blog-outlines

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit public routes
        run: npm run audit:public-routes

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run dependency security audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  production-deploy:
    name: Build, deploy, and audit production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: security-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run ESLint
        run: npm run lint

      - name: Audit static media dimensions
        run: npm run lint:media-dimensions

      - name: Check blog outlines
        run: npm run lint:blog-outlines

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit public routes
        run: npm run audit:public-routes

      - name: Verify Cloudflare Pages build output
        run: test -d dist && test -f dist/index.html

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main

      - name: Run deterministic local Lighthouse CI
        run: npm run lighthouse:ci
