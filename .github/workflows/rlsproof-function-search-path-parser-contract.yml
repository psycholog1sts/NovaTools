name: RLSProof Function Search Path Parser Contract

on:
  pull_request:
    paths:
      - 'src/tools/security/rlsproof/core/sql/migration-state.mjs'
      - 'tests/rlsproof-function-search-path-parser.mjs'
      - '.github/workflows/rlsproof-function-search-path-parser-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/rlsproof-function-search-path-parser.mjs
