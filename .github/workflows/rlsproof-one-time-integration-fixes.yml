name: rlsproof-one-time-integration-fixes

on:
  push:
    branches:
      - integrate-rlsproof-20260911
    paths:
      - '.github/workflows/rlsproof-one-time-integration-fixes.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integrate-rlsproof-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply TDD-backed integration fixes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceRequired(path, from, to) {
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes(from)) throw new Error(`${path}: expected source text not found`);
            fs.writeFileSync(path, before.replace(from, to));
          }

          {
            const path = 'src/tools/security/rlsproof/index.html';
            const before = fs.readFileSync(path, 'utf8');
            const count = (before.match(/href="\/about\.html"/g) || []).length;
            if (count !== 2) throw new Error(`${path}: expected 2 /about.html links, found ${count}`);
            fs.writeFileSync(path, before.replaceAll('href="/about.html"', 'href="/about-us.html"'));
          }

          replaceRequired(
            'index.html',
            '<li><a href="/terms-of-service.html">Terms of Service</a>\n              <a href="/refund-policy.html">Refund Policy</a></li>',
            '<li><a href="/terms-of-service.html">Terms of Service</a></li>\n              <li><a href="/refund-policy.html">Refund Policy</a></li>'
          );

          {
            const path = 'scripts/generate-localized-sitemap.mjs';
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes("['/refund-policy.html', '0.4', 'monthly']")) {
              const marker = "  ['/terms-of-service.html', '0.4', 'monthly'],\n";
              if (!before.includes(marker)) throw new Error(`${path}: terms marker not found`);
              fs.writeFileSync(path, before.replace(marker, `${marker}  ['/refund-policy.html', '0.4', 'monthly'],\n`));
            }
          }

          {
            const path = 'docs/superpowers/plans/2026-09-11-rlsproof-novatools-integration.md';
            const before = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, before.replace('Set `CertificationStatus: CERTIFIED`, `Indexable: true`, `AdsEligible: true`,', 'Set `CertificationStatus: CERTIFIED`, `Indexable: true`, `AdsEligible: false`,'));
          }
          NODE
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Verify regression suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit verified fixes and generated sitemap state
        run: |
          rm .github/workflows/rlsproof-one-time-integration-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/tools/security/rlsproof/index.html \
            index.html \
            scripts/generate-localized-sitemap.mjs \
            docs/superpowers/plans/2026-09-11-rlsproof-novatools-integration.md \
            public/sitemap*.xml sitemap*.xml site-links.txt \
            .github/workflows/rlsproof-one-time-integration-fixes.yml
          git commit -m 'fix: align RLSProof navigation policy and sitemap integration'
          git push origin HEAD:integrate-rlsproof-20260911
