name: RLSProof Table Isolation Proof Contract

on:
  pull_request:
    paths:
      - 'src/tools/security/rlsproof/core/proof/**'
      - 'tests/rlsproof-table-isolation-proof.mjs'
      - '.github/workflows/rlsproof-table-isolation-proof-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/rlsproof-table-isolation-proof.mjs
