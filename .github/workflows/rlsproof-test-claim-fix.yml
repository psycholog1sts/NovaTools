name: rlsproof-one-time-claim-test-correction

on:
  push:
    branches:
      - integrate-rlsproof-20260911

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Correct negative-claim regression matcher
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/rlsproof-integration.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const oldLine = "assert.doesNotMatch(html, /security certification|certified secure|100% secure|100% private/i);";
          const replacement = "assert.match(html, /not a security certification/i);\nassert.doesNotMatch(html, /(?:is|provides|offers)\\s+(?:a\\s+)?security certification|certified secure|100% secure|100% private/i);";
          if (!text.includes(oldLine)) throw new Error('claim-test anchor missing');
          text = text.replace(oldLine, replacement);
          fs.writeFileSync(path, text);
          NODE
      - name: Remove migration workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/rlsproof-test-claim-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rlsproof-integration.mjs
          git commit -m "test: distinguish disclaimer from certification claim"
          git push origin HEAD:integrate-rlsproof-20260911
