name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      
      - name: Check Performance Score
        run: |
          npm install -g @lhci/cli@0.13.x
          
          # Run Lighthouse and extract scores
          lhci collect --url=http://localhost:4173/ --numberOfRuns=3
          
          # Get median performance score
          PERFORMANCE=$(lhci upload --target=temporary-public-storage 2>&1 | grep -oP 'performance: \K[0-9.]+' || echo "0")
          
          echo "Performance Score: $PERFORMANCE"
          
          # Fail if below 90
          if (( $(echo "$PERFORMANCE < 0.90" | bc -l) )); then
            echo "::error::Performance score $PERFORMANCE is below 90 threshold"
            exit 1
          fi
          
          echo "✅ Performance score $PERFORMANCE meets 90+ threshold"
      
      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ./lighthouse-results/
          retention-days: 30
      
      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './lighthouse-results/manifest.json';
            
            if (!fs.existsSync(path)) {
              console.log('No manifest found');
              return;
            }
            
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summary = manifest[0]?.summary || {};
            
            const formatScore = (score) => {
              const percentage = Math.round(score * 100);
              const emoji = percentage >= 90 ? '🟢' : percentage >= 70 ? '🟡' : '🔴';
              return `${emoji} ${percentage}`;
            };
            
            const body = `## ⚡ Lighthouse Report
            
            | Category | Score |
            |----------|-------|
            | Performance | ${formatScore(summary.performance)} |
            | Accessibility | ${formatScore(summary.accessibility)} |
            | Best Practices | ${formatScore(summary['best-practices'])} |
            | SEO | ${formatScore(summary.seo)} |
            
            ${summary.performance < 0.9 ? '❌ **Performance below 90 threshold**' : '✅ **All checks passed**'}
            `;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Create issue if performance drops
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = {
              title: '⚠️ Lighthouse Performance Below Threshold',
              body: `Performance score dropped below 90.
              
              Check the [Lighthouse report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
              
              Timestamp: ${new Date().toISOString()}`,
              labels: ['performance', 'automated', 'priority-medium']
            };
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ...issue
            });
