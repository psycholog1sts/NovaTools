name: Apply converter certification slice

on:
  push:
    branches:
      - wave2/site-transformation
    paths:
      - scripts/apply-converter-certification-slice.mjs
      - .github/workflows/apply-converter-certification-slice.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: wave2/site-transformation
          fetch-depth: 0

      - name: Apply deterministic converter slice
        run: node scripts/apply-converter-certification-slice.mjs

      - name: Validate generated diff
        run: |
          git diff --check
          git status --short

      - name: Commit generated source truth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/tools/converters/number-base-converter/index.html \
            src/tools/converters/number-base-converter/meta.json \
            src/tools/converters/timezone-converter/index.html \
            src/tools/converters/timezone-converter/meta.json \
            src/data/tool-certification.json \
            tools-manifest.json
          if git diff --cached --quiet; then
            echo "No generated converter changes to commit."
            exit 0
          fi
          git commit -m "fix: certify exact converter behavior"
          git push origin HEAD:wave2/site-transformation
