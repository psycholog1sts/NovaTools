name: Wave 2 mortgage truth fix

on:
  push:
    branches: [wave2/site-transformation]
    paths:
      - scripts/fix-mortgage-finance-truth.mjs
      - .github/workflows/wave2-mortgage-truth-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[mortgage-truth-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave2/site-transformation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-mortgage-finance-truth.mjs --write
      - name: Commit deterministic output
        shell: bash
        run: |
          if git diff --quiet -- src/tools/finance/mortgage-refinance/index.html; then
            echo "No mortgage truth changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/finance/mortgage-refinance/index.html
          git commit -m "truth: remove universal refinance marketing claims [mortgage-truth-output]"
          git push origin HEAD:wave2/site-transformation
