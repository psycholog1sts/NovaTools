name: RLSProof CI Contract

on:
  pull_request:
    paths:
      - 'src/tools/security/rlsproof/**'
      - 'tests/rlsproof-ci-runner.mjs'
      - '.github/workflows/rlsproof-ci-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run RLSProof CI runner contract
        run: node tests/rlsproof-ci-runner.mjs
