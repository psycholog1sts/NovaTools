name: Wave 2 finance certification migration

on:
  push:
    branches:
      - wave2/site-transformation
    paths:
      - scripts/apply-finance-certification.mjs
      - .github/workflows/wave2-finance-certification-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[finance-cert-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave2/site-transformation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic finance certification migration
        run: node scripts/apply-finance-certification.mjs --write
      - name: Commit deterministic output
        shell: bash
        run: |
          if git diff --quiet -- src/tools/finance; then
            echo "No finance migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/finance
          git commit -m "truth: align finance public behavior and copy [finance-cert-output]"
          git push origin HEAD:wave2/site-transformation
