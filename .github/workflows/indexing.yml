name: Sitemap and Google Indexing

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_to_google:
        description: 'Send selected URLs to Google Indexing API. Keep false for validation/dry-run only.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: 'Maximum URLs to submit when send_to_google=true. Keep within your Google quota.'
        required: true
        default: '200'
      offset:
        description: 'Starting offset in site-links.txt for chunked submissions.'
        required: true
        default: '0'

permissions:
  contents: read

jobs:
  prepare:
    name: Build and verify sitemap inputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build sitemap and site links
        run: npm run build:sitemap

      - name: Verify site-links.txt matches sitemap.xml
        run: npm run lint:site-links

      - name: Dry-run Indexing API input
        run: npm run indexing:dry-run -- --limit=10

      - name: Upload indexing inputs
        uses: actions/upload-artifact@v4
        with:
          name: indexing-inputs
          path: |
            sitemap.xml
            public/sitemap.xml
            site-links.txt
          if-no-files-found: error

  index:
    name: Optional Google Indexing API submission
    if: github.event_name == 'workflow_dispatch' && inputs.send_to_google == 'true'
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Download indexing inputs
        uses: actions/download-artifact@v4
        with:
          name: indexing-inputs
          path: .

      - name: Submit selected URLs to Google Indexing API
        run: node indexing.cjs --send --input=site-links.txt --limit="${{ inputs.limit }}" --offset="${{ inputs.offset }}"
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
