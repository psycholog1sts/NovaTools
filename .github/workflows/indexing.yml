name: Google Indexing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build site for indexing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build
        run: npm run build

      - name: Verify indexing inputs
        run: |
          if [ ! -f dist/sitemap.xml ] && [ ! -f dist/robots.txt ]; then
            echo "Sitemap not found, skipping indexing"
            exit 0
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: indexing-build-output
          path: dist
          if-no-files-found: error

  index:
    name: Submit sitemap URLs to Google Indexing
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: indexing-build-output
          path: dist

      - name: Install indexing dependencies
        run: npm install --no-save --no-package-lock googleapis axios

      - name: Run Indexing Script
        run: |
          if [ ! -f dist/sitemap.xml ] && [ ! -f dist/robots.txt ]; then
            echo "Sitemap not found, skipping indexing"
            exit 0
          fi

          if [ -z "${GOOGLE_INDEXING_KEY:-}" ]; then
            echo "GOOGLE_INDEXING_KEY not configured, skipping indexing"
            exit 0
          fi

          node indexing.cjs
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}

      - name: Commit log if any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A -- ':!dist'
          git commit -m "chore: update indexing log" || exit 0
          git push
