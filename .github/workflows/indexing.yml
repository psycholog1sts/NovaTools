name: Google Indexing
on:
  push:
    branches: [ main ] # Sadece ana şubeye güncelleme gelince çalışır

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install googleapis axios
      - run: node indexing.cjs
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
