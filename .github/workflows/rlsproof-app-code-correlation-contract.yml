name: RLSProof App Code Correlation Contract

on:
  pull_request:
    paths:
      - 'src/tools/security/rlsproof/core/correlation/**'
      - 'tests/rlsproof-app-code-correlation.mjs'
      - '.github/workflows/rlsproof-app-code-correlation-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/rlsproof-app-code-correlation.mjs
