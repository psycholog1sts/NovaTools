name: Todo Source Browser Certification

on:
  pull_request:
    paths:
      - 'src/tools/productivity/todo-list/**'
      - 'tests/e2e/todo-list-source-behavior.spec.mjs'
      - 'playwright.todo-dev.config.mjs'
      - '.github/workflows/todo-source-browser-certification.yml'
  push:
    branches:
      - main
    paths:
      - 'src/tools/productivity/todo-list/**'
      - 'tests/e2e/todo-list-source-behavior.spec.mjs'
      - 'playwright.todo-dev.config.mjs'
      - '.github/workflows/todo-source-browser-certification.yml'

permissions:
  contents: read

jobs:
  todo-source-browser-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Todo source browser certification
        run: npx playwright test --config=playwright.todo-dev.config.mjs
