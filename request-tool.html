<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Tool | MC NovaTools - Suggest New Features</title>
  <meta name="description" content="Request a new tool or feature for MC NovaTools. We listen to user feedback and build tools you need.">
  <meta name="author" content="Metehan ÇETİN, LPC">
  <link rel="canonical" href="https://mc-novatools.com/request-tool.html">
  <link rel="stylesheet" href="/src/styles/critical.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="/i18n.js"></script>
</head>
<body>
  <header class="main-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="logo"><span class="logo-text">MC <span class="logo-mc">NovaTools</span></span></a>
        <nav class="nav-desktop">
          <a href="/" data-i18n="nav.home">Home</a>
          <a href="/about-us.html" data-i18n="nav.about">About</a>
          <a href="/request-tool.html" class="active" data-i18n="nav.request">Request Tool</a>
        </nav>
        <div class="header-actions">
          <select id="language-selector" class="language-selector" aria-label="Select Language">
            <option value="en">🇬🇧 English</option>
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="ar">🇸🇦 العربية</option>
            <option value="hi">🇮🇳 हिंदी</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pl">🇵🇱 Polski</option>
            <option value="nl">🇳🇱 Nederlands</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Request a Tool</h1>
        <p>Have an idea? We'd love to hear it!</p>
      </div>
    </section>

    <section class="content-section">
      <div class="container">
        <p>MC NovaTools is built on user feedback. Many of our most popular tools started as user suggestions.</p>
        
        <form class="request-form" action="https://mail.google.com/mail/?view=cm&fs=1&to=psk.dan.metehancetin@mc-novatools.com" method="post" enctype="text/plain">
          <div class="form-group">
            <label for="tool-name">Proposed Tool Name *</label>
            <input type="text" id="tool-name" name="tool-name" placeholder="e.g., PDF to EPUB Converter" required>
          </div>
          
          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
              <option value="">Select category</option>
              <option value="pdf">PDF Tools</option>
              <option value="image">Image Tools</option>
              <option value="finance">Finance Tools</option>
              <option value="developer">Developer Tools</option>
              <option value="text">Text & Writing</option>
              <option value="converter">Converters</option>
              <option value="other">Other</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="description">Tool Description *</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe what the tool should do..." required></textarea>
          </div>
          
          <div class="form-group">
            <label for="email">Your Email (optional)</label>
            <input type="email" id="email" name="email" placeholder="So we can notify you">
          </div>
          
          <button type="submit" class="btn btn-primary">Submit Request</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 MC NovaTools. Metehan ÇETİN, LPC. <a href="https://mail.google.com/mail/?view=cm&fs=1&to=psk.dan.metehancetin@mc-novatools.com">psk.dan.metehancetin@mc-novatools.com</a></p>
    </div>
  </footer>
</body>
</html>
