<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/styles/critical.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Daily Tech & Finance News Brief | AI Summarizer | NovaTools MC</title>
  <meta name="description" content="Daily curated tech and finance news briefs. AI-powered summaries of market trends, crypto updates, and technology breakthroughs. Updated hourly.">
  <meta name="theme-color" content="#0A0A0C">
  <style>
    .news-hero { text-align: center; padding: 2rem 0; }
    .last-updated { font-size: 0.875rem; color: var(--text-tertiary); margin-top: 0.5rem; }
    .news-categories { display: flex; gap: 0.75rem; justify-content: center; margin: 1.5rem 0; flex-wrap: wrap; }
    .category-btn { padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid var(--border-default); background: var(--surface-default); color: var(--text-secondary); font-size: 0.875rem; cursor: pointer; transition: all 0.2s; }
    .category-btn:hover, .category-btn.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
    .news-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin: 2rem 0; }
    @media (min-width: 768px) { .news-grid { grid-template-columns: 2fr 1fr; } }
    .news-card { background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 1.5rem; transition: all 0.2s; }
    .news-card:hover { transform: translateY(-2px); border-color: rgba(99, 102, 241, 0.3); }
    .news-card.featured { border-color: rgba(99, 102, 241, 0.3); background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), transparent); }
    .news-source { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .source-badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 4px; background: rgba(99, 102, 241, 0.15); color: var(--accent-hover); font-weight: 500; }
    .news-time { font-size: 0.75rem; color: var(--text-muted); }
    .news-title { font-size: 1.125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.75rem; line-height: 1.4; }
    .news-summary { font-size: 0.9375rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1rem; }
    .news-meta { display: flex; align-items: center; gap: 1rem; font-size: 0.8125rem; color: var(--text-muted); }
    .sentiment { display: inline-flex; align-items: center; gap: 0.25rem; }
    .sentiment.positive { color: #22C55E; }
    .sentiment.negative { color: #ef4444; }
    .sentiment.neutral { color: #F59E0B; }
    .trending-sidebar { background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 1.5rem; }
    .trending-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .trending-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border-default); }
    .trending-item:last-child { border-bottom: none; }
    .trending-keyword { font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem; }
    .trending-count { font-size: 0.75rem; color: var(--text-muted); }
    .refresh-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-secondary); font-size: 0.9375rem; cursor: pointer; transition: all 0.2s; }
    .refresh-btn:hover { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
    .loading-skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-md); height: 120px; margin-bottom: 1rem; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  
  <div id="app" class="app">
    <header class="main-header">
      <div class="container">
        <div class="header-inner">
          <a href="/" class="logo" aria-label="NovaTools MC Home">
            <div class="logo-icon neon-logo">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00F5D4"/><stop offset="50%" style="stop-color:#00D9FF"/><stop offset="100%" style="stop-color:#00FF88"/></linearGradient></defs>
                <path d="M50 75 L35 55 L25 40 L35 45 L45 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L65 55 L75 40 L65 45 L55 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L50 55 L45 45 L50 50 L55 45 L50 55" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L45 85 L50 80 L55 85 L50 75" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <span class="logo-text">NovaTools <span class="logo-mc">MC</span></span>
          </a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="container" style="padding: 2rem 1rem;">
        <div class="news-hero">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📰</div>
          <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem;">Tech & Finance News Brief</h1>
          <p style="color: var(--text-secondary);">AI-curated summaries of market trends, crypto updates, and technology</p>
          <div class="last-updated">Last updated: <span id="lastUpdated">-</span></div>
          <button class="refresh-btn" id="refreshBtn" style="margin-top: 1rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Refresh News
          </button>
        </div>

        <div class="news-categories">
          <button class="category-btn active" data-category="all">All News</button>
          <button class="category-btn" data-category="crypto">Crypto</button>
          <button class="category-btn" data-category="stocks">Stocks</button>
          <button class="category-btn" data-category="tech">Technology</button>
          <button class="category-btn" data-category="finance">Finance</button>
        </div>

        <div class="news-grid">
          <div id="newsContainer">
            <!-- News loaded dynamically -->
          </div>

          <aside class="trending-sidebar">
            <div class="trending-title">
              <span>🔥</span> Trending Now
            </div>
            <div id="trendingContainer">
              <!-- Trending keywords loaded dynamically -->
            </div>
            
            <!-- Sidebar Ad -->
            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-default);">
              <div style="font-size: 0.6875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem;">Sponsored</div>
              <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 0.75rem;">
                <ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="NEWS_SIDEBAR_SLOT"></ins>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p class="footer-copyright">© 2025 NovaTools MC. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // News API Placeholder - Ready for real API integration
    const NewsAPI = {
      // TODO: Replace with actual API key and endpoint
      // const API_KEY = 'YOUR_NEWS_API_KEY';
      // const BASE_URL = 'https://newsapi.org/v2';
      
      async fetchNews(category = 'all') {
        // Placeholder data - Replace with actual API call
        const mockNews = [
          {
            id: 1,
            title: "Bitcoin Surges Past $50K as ETF Inflows Continue",
            summary: "Bitcoin has broken through the $50,000 resistance level driven by sustained institutional investment in spot Bitcoin ETFs. Analysts predict further upside potential as adoption grows.",
            source: "CryptoDaily",
            category: "crypto",
            time: "2 hours ago",
            sentiment: "positive",
            featured: true
          },
          {
            id: 2,
            title: "Fed Signals Potential Rate Cuts in Q2 2026",
            summary: "The Federal Reserve has indicated that interest rate cuts may be coming in the second quarter of 2026, depending on inflation data. Markets responded positively to the news.",
            source: "FinanceToday",
            category: "finance",
            time: "4 hours ago",
            sentiment: "positive"
          },
          {
            id: 3,
            title: "NVIDIA Announces Next-Gen AI Chips",
            summary: "NVIDIA has unveiled its next-generation AI chips, promising 3x performance improvement over current models. The announcement sent the stock up 5% in after-hours trading.",
            source: "TechInsider",
            category: "tech",
            time: "5 hours ago",
            sentiment: "positive"
          },
          {
            id: 4,
            title: "Ethereum Layer 2 Solutions See Record Usage",
            summary: "Ethereum Layer 2 scaling solutions have reached an all-time high in daily transactions, with Arbitrum and Optimism leading the pack. Gas fees on L2 have dropped to record lows.",
            source: "BlockChainNews",
            category: "crypto",
            time: "6 hours ago",
            sentiment: "neutral"
          },
          {
            id: 5,
            title: "Global Markets React to Middle East Tensions",
            summary: "Oil prices have climbed 3% as geopolitical tensions in the Middle East raise supply concerns. Safe-haven assets including gold and the Japanese yen have strengthened.",
            source: "MarketWatch",
            category: "stocks",
            time: "8 hours ago",
            sentiment: "negative"
          }
        ];
        
        // Filter by category
        if (category !== 'all') {
          return mockNews.filter(n => n.category === category);
        }
        return mockNews;
      },
      
      async fetchTrending() {
        // Placeholder trending data
        return [
          { keyword: "Bitcoin", count: 15420 },
          { keyword: "NVIDIA", count: 12350 },
          { keyword: "Fed Rates", count: 11200 },
          { keyword: "AI Chips", count: 9800 },
          { keyword: "Ethereum", count: 8540 },
          { keyword: "Oil Prices", count: 7200 }
        ];
      }
    };

    // Render news
    async function loadNews(category = 'all') {
      const container = document.getElementById('newsContainer');
      container.innerHTML = '<div class="loading-skeleton"></div><div class="loading-skeleton"></div><div class="loading-skeleton"></div>';
      
      try {
        const news = await NewsAPI.fetchNews(category);
        
        container.innerHTML = news.map(item => `
          <article class="news-card ${item.featured ? 'featured' : ''}">
            <div class="news-source">
              <span class="source-badge">${item.source}</span>
              <span class="news-time">${item.time}</span>
            </div>
            <h3 class="news-title">${item.title}</h3>
            <p class="news-summary">${item.summary}</p>
            <div class="news-meta">
              <span class="sentiment ${item.sentiment}">
                ${item.sentiment === 'positive' ? '🟢' : item.sentiment === 'negative' ? '🔴' : '🟡'}
                ${item.sentiment.charAt(0).toUpperCase() + item.sentiment.slice(1)}
              </span>
              <span>💬 AI Summary</span>
            </div>
          </article>
        `).join('');
        
        updateTimestamp();
      } catch (error) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Failed to load news. Please try again.</p>';
      }
    }

    // Render trending
    async function loadTrending() {
      const container = document.getElementById('trendingContainer');
      try {
        const trending = await NewsAPI.fetchTrending();
        container.innerHTML = trending.map((item, index) => `
          <div class="trending-item">
            <div class="trending-keyword">
              <span style="color: var(--text-muted); font-size: 0.875rem;">#${index + 1}</span>
              ${item.keyword}
            </div>
            <div class="trending-count">${item.count.toLocaleString()} mentions</div>
          </div>
        `).join('');
      } catch (error) {
        container.innerHTML = '<p style="color: var(--text-muted);">Failed to load trending topics.</p>';
      }
    }

    function updateTimestamp() {
      document.getElementById('lastUpdated').textContent = new Date().toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Category filter
    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadNews(btn.dataset.category);
      });
    });

    // Refresh button
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadNews();
      loadTrending();
    });

    // Initialize
    loadNews();
    loadTrending();
    
    // Push AdSense
    if (window.adsbygoogle) {
      window.adsbygoogle.push({});
    }
  </script>
</body>
</html>
