<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/styles/critical.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Tax Calculator | NovaTools MC</title>
  <meta name="description" content="Estimate your federal and state taxes. Calculate tax liability based on income, deductions, and filing status.">
  <meta name="theme-color" content="#0A0A0C">
  <style>
    .calculator-form { background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 2rem; margin: 2rem 0; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-size: 0.9375rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .form-group input, .form-group select { width: 100%; height: 48px; padding: 0 1rem; background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); font-size: 1rem; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    .results-panel { background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.05)); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: var(--radius-lg); padding: 2rem; margin-top: 2rem; display: none; }
    .results-panel.visible { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  <div id="app" class="app">
    <header class="main-header">
      <div class="container">
        <div class="header-inner">
          <a href="/" class="logo" aria-label="NovaTools MC Home">
            <div class="logo-icon neon-logo">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00F5D4"/><stop offset="50%" style="stop-color:#00D9FF"/><stop offset="100%" style="stop-color:#00FF88"/></linearGradient></defs>
                <path d="M50 75 L35 55 L25 40 L35 45 L45 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L65 55 L75 40 L65 45 L55 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L50 55 L45 45 L50 50 L55 45 L50 55" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L45 85 L50 80 L55 85 L50 75" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <span class="logo-text">NovaTools <span class="logo-mc">MC</span></span>
          </a>
        </div>
      </div>
    </header>
    <main class="main-content">
      <div class="container" style="padding: 4rem 1rem;">
        <div style="max-width: 800px; margin: 0 auto;">
          <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; text-align: center;">Tax Estimator</h1>
          <p style="color: var(--text-secondary); text-align: center; margin-bottom: 2rem;">Estimate your tax liability based on income, deductions, and filing status.</p>
          <div class="calculator-form">
            <div class="form-row">
              <div class="form-group"><label>Filing Status</label><select id="filingStatus"><option value="single">Single</option><option value="married">Married Filing Jointly</option><option value="head">Head of Household</option></select></div>
              <div class="form-group"><label>Gross Income ($)</label><input type="number" id="grossIncome" placeholder="75000" min="0"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Pre-tax Deductions ($)</label><input type="number" id="deductions" placeholder="10000" min="0"></div>
              <div class="form-group"><label>Tax Credits ($)</label><input type="number" id="taxCredits" placeholder="2000" min="0"></div>
            </div>
            <button type="button" id="calcBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; height: 52px;">Calculate Tax Estimate</button>
          </div>
          <div id="results" class="results-panel">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Tax Estimate</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
              <div style="text-align: center; padding: 1.5rem; background: var(--surface-default); border-radius: var(--radius-md);">
                <div id="taxableIncome" style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary);">$0</div>
                <div style="font-size: 0.875rem; color: var(--text-tertiary);">Taxable Income</div>
              </div>
              <div style="text-align: center; padding: 1.5rem; background: var(--surface-default); border-radius: var(--radius-md);">
                <div id="taxLiability" style="font-size: 1.5rem; font-weight: 700; color: var(--accent-hover);">$0</div>
                <div style="font-size: 0.875rem; color: var(--text-tertiary);">Estimated Tax</div>
              </div>
              <div style="text-align: center; padding: 1.5rem; background: var(--surface-default); border-radius: var(--radius-md);">
                <div id="effectiveRate" style="font-size: 1.5rem; font-weight: 700; color: var(--accent-hover);">0%</div>
                <div style="font-size: 0.875rem; color: var(--text-tertiary);">Effective Rate</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p class="footer-copyright">© 2025 NovaTools MC</p></div></div></footer>
  </div>
  <script>
    document.getElementById('calcBtn').addEventListener('click', function() {
      const income = parseFloat(document.getElementById('grossIncome').value) || 0;
      const deductions = parseFloat(document.getElementById('deductions').value) || 0;
      const credits = parseFloat(document.getElementById('taxCredits').value) || 0;
      const filingStatus = document.getElementById('filingStatus').value;
      
      const taxableIncome = Math.max(0, income - deductions);
      
      // Simplified 2024 tax brackets (single filer)
      let tax = 0;
      const brackets = filingStatus === 'married' ? 
        [[23200, 0.1], [94300, 0.12], [201050, 0.22], [383900, 0.24], [487450, 0.32], [731200, 0.35], [Infinity, 0.37]] :
        filingStatus === 'head' ?
        [[16550, 0.1], [63100, 0.12], [100500, 0.22], [191950, 0.24], [243700, 0.32], [609350, 0.35], [Infinity, 0.37]] :
        [[11600, 0.1], [47150, 0.12], [100525, 0.22], [191950, 0.24], [243725, 0.32], [609350, 0.35], [Infinity, 0.37]];
      
      let remaining = taxableIncome;
      let previous = 0;
      for (const [limit, rate] of brackets) {
        if (remaining <= 0) break;
        const taxableAtRate = Math.min(remaining, limit - previous);
        tax += taxableAtRate * rate;
        remaining -= taxableAtRate;
        previous = limit;
      }
      
      const finalTax = Math.max(0, tax - credits);
      const effectiveRate = income > 0 ? ((finalTax / income) * 100).toFixed(1) : 0;
      
      const formatCurrency = (num) => '$' + num.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      
      document.getElementById('taxableIncome').textContent = formatCurrency(taxableIncome);
      document.getElementById('taxLiability').textContent = formatCurrency(finalTax);
      document.getElementById('effectiveRate').textContent = effectiveRate + '%';
      document.getElementById('results').classList.add('visible');
    });
  </script>
</body>
</html>
