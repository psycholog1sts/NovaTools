<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/styles/critical.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <title>Mortgage Refinance Calculator | NovaTools MC</title>
  <meta name="description" content="Calculate mortgage refinance savings. Compare current vs new rates, find break-even point, and save thousands on your home loan.">
  <meta name="theme-color" content="#0A0A0C">
  
  <style>
    .calculator-form {
      background: var(--surface-default);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin: 2rem 0;
    }
    
    .form-section {
      margin-bottom: 2rem;
    }
    
    .form-section-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-default);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    
    .form-group input {
      width: 100%;
      height: 48px;
      padding: 0 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    
    .form-group input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    
    @media (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    
    .field-error {
      color: var(--error);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    
    .results-panel {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.05));
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-top: 2rem;
      display: none;
    }
    
    .results-panel.visible {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    .result-item {
      text-align: center;
      padding: 1.25rem;
      background: var(--surface-default);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-default);
    }
    
    .result-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-hover);
      margin-bottom: 0.25rem;
    }
    
    .result-label {
      font-size: 0.875rem;
      color: var(--text-tertiary);
    }
    
    .result-item.positive .result-value {
      color: var(--success);
    }
    
    .result-item.negative .result-value {
      color: var(--error);
    }
    
    .result-highlight {
      text-align: center;
      padding: 1.5rem;
      background: var(--surface-default);
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
    }
    
    .result-highlight.positive {
      border: 1px solid var(--success);
    }
    
    .result-highlight.negative {
      border: 1px solid var(--error);
    }
    
    .result-highlight.warning {
      border: 1px solid var(--warning);
    }
    
    .comparison-table {
      margin-top: 2rem;
      overflow-x: auto;
    }
    
    .comparison-table table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .comparison-table th,
    .comparison-table td {
      padding: 0.75rem;
      text-align: right;
      border-bottom: 1px solid var(--border-default);
    }
    
    .comparison-table th:first-child,
    .comparison-table td:first-child {
      text-align: left;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  
  <div id="app" class="app">
    <header class="main-header">
      <div class="container">
        <div class="header-inner">
          <a href="/" class="logo" aria-label="NovaTools MC Home">
            <div class="logo-icon neon-logo">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00F5D4"/><stop offset="50%" style="stop-color:#00D9FF"/><stop offset="100%" style="stop-color:#00FF88"/></linearGradient></defs>
                <path d="M50 75 L35 55 L25 40 L35 45 L45 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L65 55 L75 40 L65 45 L55 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L50 55 L45 45 L50 50 L55 45 L50 55" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L45 85 L50 80 L55 85 L50 75" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <span class="logo-text">NovaTools <span class="logo-mc">MC</span></span>
          </a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="container" style="padding: 4rem 1rem;">
        <div style="max-width: 800px; margin: 0 auto;">
          <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; text-align: center;">Mortgage Refinance Calculator</h1>
          <p style="color: var(--text-secondary); text-align: center; margin-bottom: 2rem;">Calculate your potential savings by refinancing your mortgage. Compare rates and find your break-even point.</p>
          
          <form class="calculator-form" data-tool="mortgage-refinance" data-result=".results-panel">
            <div class="form-section">
              <h2 class="form-section-title">Current Loan</h2>
              
              <div class="form-row">
                <div class="form-group">
                  <label for="balance">Current Balance ($)</label>
                  <input type="number" id="balance" name="balance" placeholder="300000" min="1000" step="1000" required>
                </div>
                <div class="form-group">
                  <label for="currentRate">Current Interest Rate (%)</label>
                  <input type="number" id="currentRate" name="currentRate" placeholder="6.5" min="0.01" max="20" step="0.01" required>
                </div>
              </div>
              
              <div class="form-group">
                <label for="yearsRemaining">Years Remaining</label>
                <input type="number" id="yearsRemaining" name="yearsRemaining" placeholder="25" min="1" max="30" step="1" required>
              </div>
            </div>
            
            <div class="form-section">
              <h2 class="form-section-title">New Loan</h2>
              
              <div class="form-row">
                <div class="form-group">
                  <label for="newRate">New Interest Rate (%)</label>
                  <input type="number" id="newRate" name="newRate" placeholder="4.5" min="0.01" max="20" step="0.01" required>
                </div>
                <div class="form-group">
                  <label for="newTerm">New Loan Term (Years)</label>
                  <input type="number" id="newTerm" name="newTerm" placeholder="30" min="1" max="30" step="1" required>
                </div>
              </div>
              
              <div class="form-group">
                <label for="closingCosts">Closing Costs ($)</label>
                <input type="number" id="closingCosts" name="closingCosts" placeholder="5000" min="0" step="500" value="5000">
              </div>
            </div>
            
            <button type="submit" class="btn btn-primary calculate-btn" style="width: 100%; height: 52px; font-size: 1rem;">
              Calculate Savings
            </button>
          </form>
          
          <div class="results-panel">
            <!-- Results will be rendered here by ToolBridge -->
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p class="footer-copyright">© 2025 NovaTools MC. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </div>

  <!-- Load main app module which includes tool registration -->
  <script type="module" src="/src/app.mjs"></script>
</body>
</html>
