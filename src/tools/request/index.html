<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y896L63239"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Tool | NovaTools MC</title>
  <meta name="description" content="Suggest a new tool for NovaTools MC. Share your ideas and help us build better utilities.">
  <link rel="stylesheet" href="/src/styles/critical.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="canonical" href="https://novatools.mc/src/tools/request/">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  
  <header class="main-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="logo" aria-label="NovaTools MC Home">
          <div class="logo-icon neon-logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00F5D4"/><stop offset="50%" style="stop-color:#00D9FF"/><stop offset="100%" style="stop-color:#00FF88"/></linearGradient></defs>
              <path d="M50 75 L35 55 L25 40 L35 45 L45 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M50 75 L65 55 L75 40 L65 45 L55 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M50 75 L50 55 L45 45 L50 50 L55 45 L50 55" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M50 75 L45 85 L50 80 L55 85 L50 75" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <span class="logo-text">NovaTools <span class="logo-mc">MC</span></span>
        </a>
        <div class="privacy-badge">
          <span class="privacy-badge-dot"></span>
          <span>Privacy First</span>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding: 4rem 1rem;">
      <div style="max-width: 600px; margin: 0 auto;">
        <article class="card">
          <div class="card-body" style="padding: 2rem;">
            <header style="margin-bottom: 2rem; text-align: center;">
              <h1 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 0.5rem;">Request a Tool</h1>
              <p style="color: var(--text-secondary);">Have an idea for a new tool? We'd love to hear it.</p>
            </header>

            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="space-y-6" id="toolRequestForm">
              <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
              <input type="hidden" name="_subject" value="New Tool Request - NovaTools MC">
              <input type="hidden" name="_next" value="https://novatools.mc/src/tools/request/thanks.html">

              <div class="form-group">
                <label for="email" class="form-label">Email (Optional)</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com">
              </div>

              <div class="form-group">
                <label for="toolName" class="form-label">Tool Name <span style="color: var(--error)">*</span></label>
                <input type="text" id="toolName" name="tool_name" class="form-input" placeholder="e.g., CSV to JSON Converter" required minlength="3">
              </div>

              <div class="form-group">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-input">
                  <option value="">Select a category...</option>
                  <option value="pdf">PDF Tools</option>
                  <option value="image">Image Tools</option>
                  <option value="finance">Finance Tools</option>
                  <option value="dev">Developer Tools</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="description" class="form-label">Description <span style="color: var(--error)">*</span></label>
                <textarea id="description" name="description" class="form-input" style="min-height: 120px;" placeholder="Describe what the tool should do and how it would help you..." required minlength="20" rows="4"></textarea>
              </div>

              <div class="form-group" style="display: flex; align-items: flex-start; gap: 0.75rem;">
                <input type="checkbox" id="privacy" name="privacy" style="margin-top: 0.25rem;" required>
                <label for="privacy" style="font-size: 0.875rem; color: var(--text-secondary);">
                  I understand this form uses Formspree for submission.
                </label>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request</button>
            </form>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="tool-footer">
  <p>&copy; 2026 NovaTools MC &mdash; Psk. Metehan CETIN | <a href="mailto:proside2026@gmail.com">proside2026@gmail.com</a></p>
  <p>Estimates only &mdash; not financial, legal, or tax advice.</p>
</footer>
<style>
.tool-footer { margin-top: 3rem; padding: 1.5rem 1rem; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; color: #718096; font-size: 0.8rem; line-height: 1.8; }
.tool-footer a { color: #00D9FF; text-decoration: none; }
</style>

  <script type="module" src="/src/main.mjs"></script>
  <script>
    document.getElementById('toolRequestForm').addEventListener('submit', function(e) {
      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Sending...';
    });
  </script>
</body>
</html>
