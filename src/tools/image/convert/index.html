<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/styles/critical.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Image Converter | JPEG PNG WebP GIF | NovaTools MC</title>
  <meta name="description" content="Convert images between different formats. Supports JPEG, PNG, WebP, and GIF. 100% private - all processing in your browser.">
  <meta name="theme-color" content="#0A0A0C">
  <style>
    .tool-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .tool-header { text-align: center; margin-bottom: 2rem; }
    .tool-header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .dropzone { border: 2px dashed rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 3rem 2rem; text-align: center; background: rgba(255, 255, 255, 0.03); transition: all 0.3s ease; cursor: pointer; }
    .dropzone:hover { border-color: rgba(99, 102, 241, 0.5); background: rgba(255, 255, 255, 0.06); }
    .dropzone.drag-active { border-color: #6366F1; background: rgba(99, 102, 241, 0.1); transform: scale(1.02); }
    .controls { margin-top: 1.5rem; padding: 1.5rem; background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-lg); display: none; }
    .controls.visible { display: block; }
    .form-select { width: 100%; height: 48px; margin-top: 0.5rem; padding: 0 1rem; background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); }
    .preview-box { padding: 1rem; background: rgba(255, 255, 255, 0.05); border-radius: var(--radius-md); text-align: center; margin: 1.5rem 0; }
    .preview-box img { max-width: 100%; max-height: 200px; border-radius: var(--radius-md); }
    .result-section { margin-top: 1.5rem; padding: 2rem; background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(99, 102, 241, 0.05)); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: var(--radius-lg); text-align: center; display: none; }
    .result-section.visible { display: block; }
    .download-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 1rem 2rem; background: linear-gradient(135deg, #6366F1, #4F46E5); color: white; font-weight: 600; border-radius: var(--radius-md); text-decoration: none; }
    .quality-slider { width: 100%; margin: 1rem 0; }
  </style>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  
  <div id="app" class="app">
    <header class="main-header">
      <div class="container">
        <div class="header-inner">
          <a href="/" class="logo" aria-label="NovaTools MC Home">
            <div class="logo-icon neon-logo">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00F5D4"/><stop offset="50%" style="stop-color:#00D9FF"/><stop offset="100%" style="stop-color:#00FF88"/></linearGradient></defs>
                <path d="M50 75 L35 55 L25 40 L35 45 L45 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L65 55 L75 40 L65 45 L55 50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L50 55 L45 45 L50 50 L55 45 L50 55" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M50 75 L45 85 L50 80 L55 85 L50 75" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <span class="logo-text">NovaTools <span class="logo-mc">MC</span></span>
          </a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="tool-container">
        <div class="tool-header">
          <h1>🔄 Image Converter</h1>
          <p>Convert images between different formats. Supports JPEG, PNG, WebP, and GIF.</p>
        </div>
        
        <form data-tool="image-convert" data-result=".results-panel">
          <div id="dropzone" class="dropzone">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔄</div>
            <div style="font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem;">Drop image here or click to browse</div>
            <div style="font-size: 0.875rem; color: var(--text-muted);">Supports all image formats • Max 20MB</div>
            <input type="file" name="file" id="fileInput" accept="image/*" style="display: none;">
          </div>
          
          <div id="controls" class="controls">
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Output Format</label>
            <select name="format" id="formatSelect" class="form-select">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
              <option value="gif">GIF</option>
            </select>
            
            <div id="qualityContainer" style="margin-top: 1rem;">
              <label style="font-weight: 600;">Quality: <span id="qualityValue">90</span>%</label>
              <input type="range" name="quality" id="qualitySlider" class="quality-slider" min="1" max="100" value="90">
            </div>
            
            <div class="preview-box">
              <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">Preview</p>
              <img id="previewImage" src="" alt="Preview">
              <p id="fileInfo" style="font-size: 0.875rem; margin-top: 0.5rem; color: var(--text-muted);"></p>
            </div>
            
            <button type="submit" id="convertBtn" class="btn btn-primary" style="width: 100%; height: 52px;">Convert Image</button>
          </div>
        </form>
        
        <div class="results-panel">
          <div id="resultSection" class="result-section">
            <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
            <h3 style="margin-bottom: 0.5rem;">Image Converted!</h3>
            <p id="resultText" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>
            <a id="downloadLink" href="#" class="download-btn" download>Download Converted Image</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p class="footer-copyright">© 2026 NovaTools MC. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
