<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MC NovaTools workflow dashboard preview</title>
  <desc id="desc">A lightweight vector preview of the NovaTools workflow launcher with browser-first utility cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="0.55" stop-color="#10172a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="170" fill="#22d3ee" opacity="0.12"/>
  <circle cx="120" cy="570" r="220" fill="#8b5cf6" opacity="0.11"/>
  <g filter="url(#softShadow)">
    <rect x="130" y="96" width="940" height="438" rx="30" fill="url(#panel)" stroke="#334155" stroke-opacity="0.65"/>
    <rect x="170" y="136" width="860" height="54" rx="18" fill="#0f172a" stroke="#334155"/>
    <circle cx="202" cy="163" r="7" fill="#ef4444"/>
    <circle cx="228" cy="163" r="7" fill="#f59e0b"/>
    <circle cx="254" cy="163" r="7" fill="#22c55e"/>
    <text x="296" y="170" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Workflow launcher</text>
    <rect x="170" y="224" width="860" height="66" rx="20" fill="#08111f" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="206" y="265" fill="#67e8f9" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">compress pdf for email</text>
    <g font-family="Inter, Arial, sans-serif">
      <rect x="170" y="324" width="260" height="112" rx="22" fill="#111c32" stroke="#334155"/>
      <text x="202" y="366" fill="#f8fafc" font-size="25" font-weight="800">Compress PDF</text>
      <text x="202" y="405" fill="#94a3b8" font-size="18">Browser-first workflow</text>
      <rect x="470" y="324" width="260" height="112" rx="22" fill="#111c32" stroke="#334155"/>
      <text x="502" y="366" fill="#f8fafc" font-size="25" font-weight="800">Image tools</text>
      <text x="502" y="405" fill="#94a3b8" font-size="18">Fast local previews</text>
      <rect x="770" y="324" width="260" height="112" rx="22" fill="#111c32" stroke="#334155"/>
      <text x="802" y="366" fill="#f8fafc" font-size="25" font-weight="800">Finance</text>
      <text x="802" y="405" fill="#94a3b8" font-size="18">Clear assumptions</text>
    </g>
    <rect x="170" y="470" width="302" height="34" rx="17" fill="#042f2e" stroke="#14b8a6" stroke-opacity="0.55"/>
    <text x="194" y="493" fill="#99f6e4" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Files stay on your device</text>
    <rect x="500" y="470" width="248" height="34" rx="17" fill="#172554" stroke="#60a5fa" stroke-opacity="0.45"/>
    <text x="524" y="493" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">No forced signup</text>
  </g>
</svg>
