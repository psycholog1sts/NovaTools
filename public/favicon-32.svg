<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <!-- Phoenix gradient - cyan to green -->
    <linearGradient id="phoenixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5D4"/>
      <stop offset="50%" style="stop-color:#00D9FF"/>
      <stop offset="100%" style="stop-color:#00FF88"/>
    </linearGradient>
    
    <!-- Neon glow filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0A0A0C"/>
  
  <!-- Phoenix Symbol -->
  <g filter="url(#neonGlow)" fill="none" stroke="url(#phoenixGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Wing -->
    <path d="M50 75 L35 55 L25 40 L35 45 L45 50"/>
    <path d="M35 55 L30 35 L40 45" stroke-width="2"/>
    <path d="M25 40 L20 25 L32 38" stroke-width="2"/>
    
    <!-- Right Wing -->
    <path d="M50 75 L65 55 L75 40 L65 45 L55 50"/>
    <path d="M65 55 L70 35 L60 45" stroke-width="2"/>
    <path d="M75 40 L80 25 L68 38" stroke-width="2"/>
    
    <!-- Body/Center -->
    <path d="M50 75 L50 55 L45 45 L50 50 L55 45 L50 55"/>
    <path d="M50 50 L42 35 L50 42 L58 35 L50 50"/>
    
    <!-- Tail -->
    <path d="M50 75 L45 85 L50 80 L55 85 L50 75"/>
    <path d="M50 80 L48 90 L50 85 L52 90 L50 80" stroke-width="2"/>
    
    <!-- Digital pixels accent -->
    <rect x="55" y="25" width="4" height="4" fill="url(#phoenixGrad)" stroke="none"/>
    <rect x="62" y="20" width="3" height="3" fill="url(#phoenixGrad)" stroke="none"/>
    <rect x="68" y="16" width="2" height="2" fill="url(#phoenixGrad)" stroke="none"/>
  </g>
</svg>
